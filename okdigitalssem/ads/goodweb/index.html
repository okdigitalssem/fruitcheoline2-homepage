<script>
var v=document.getElementById('v'),s=document.getElementById('s');
function lab(){var on=!v.muted&&!v.paused;s.textContent=on?'소리 끄기':'🔊 소리 켜고 보기';s.classList.toggle('on',on);}
s.addEventListener('click',function(){if(v.muted||v.paused){v.muted=false;v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;lab();});}else{v.muted=true;}setTimeout(lab,150);});
['play','pause','volumechange'].forEach(function(e){v.addEventListener(e,lab);});
